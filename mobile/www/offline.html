<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>1Link — hors connexion</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #fff; text-align: center; background: linear-gradient(135deg, #2563eb, #7c3aed); }
      main { max-width: 22rem; display: grid; gap: 14px; justify-items: center; }
      .logo { width: 84px; height: 84px; border-radius: 24px; background: #fff; display: grid; place-items: center; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
      h1 { margin: 6px 0 0; font-size: 1.5rem; }
      p { margin: 0; opacity: .92; line-height: 1.5; }
      button { margin-top: 8px; border: 0; border-radius: 999px; padding: 14px 26px; font: inherit; font-weight: 700; color: #2563eb; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#g)"/><path d="M14.5 17.5 22 11.5V34h8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="34" r="3.1" fill="none" stroke="#fff" stroke-width="2.6"/></svg>
      </div>
      <h1>Pas de connexion</h1>
      <p>1Link a besoin d’internet pour afficher vos pages. Vérifiez votre réseau (Wi-Fi ou données mobiles) puis réessayez.</p>
      <button type="button" onclick="location.href='https://1link-gn.vercel.app/'">Réessayer</button>
    </main>
  </body>
</html>
